<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>CRUD Analytics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-3 -1 70 66'%3E%3Crect x='-3' y='-1' width='70' height='66' rx='18' fill='%23FFC31F'/%3E%3Cg stroke='%23141414' stroke-width='3' stroke-linejoin='round' fill='%23A9AFC2'%3E%3Cpath d='M19 21C8 16 1 25 3 35c2 9 10 12 17 7z'/%3E%3Cpath d='M45 21c11-5 18 4 16 14-2 9-10 12-17 7z'/%3E%3Cellipse cx='32' cy='31' rx='17' ry='16'/%3E%3Cpath d='M27.6 38.5c-1.4 7.5-.8 13.6 3.6 16.6 3.6 2.4 8.3.6 7.6-3.4-.3-1.8-2.4-2.2-3.1-.6-.5 1.3-1.7 1.8-2.7 1-1.9-1.6-1.4-7.2.3-13.6z'/%3E%3C/g%3E%3Cellipse cx='25.6' cy='29.6' rx='2.8' ry='3.4' fill='%23141414'/%3E%3Cellipse cx='38.4' cy='29.6' rx='2.8' ry='3.4' fill='%23141414'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F2EC; --card:#FFFEFA; --fg:#141414; --fg-2:#46433D; --muted:#85817A; --line:#E0DBCF; --grid:#ECE8DE;
  --brand:#FFC31F; --brand-soft:#FFF1C2; --series:#2a78d6; --series-wash:rgba(42,120,214,.1);
  --good:#12845A; --warn:#B26C06; --danger:#D23A2E;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --font:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#121211; --card:#1B1B19; --fg:#F2EFE8; --fg-2:#C9C5BC; --muted:#8F8B83; --line:#2C2B28; --grid:#262522;
  --brand-soft:#3A2F0E; --series:#3987e5; --series-wash:rgba(57,135,229,.14); --good:#4CC68B; --warn:#F0B44E; --danger:#FF7A6E; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#121211; --card:#1B1B19; --fg:#F2EFE8; --fg-2:#C9C5BC; --muted:#8F8B83; --line:#2C2B28; --grid:#262522;
  --brand-soft:#3A2F0E; --series:#3987e5; --series-wash:rgba(57,135,229,.14); --good:#4CC68B; --warn:#F0B44E; --danger:#FF7A6E; color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-family:var(--display);font-weight:800;font-size:19px}
.brand img{width:30px;height:30px}
.brand span b{color:var(--muted);font-weight:700}
.seg{margin-left:auto;display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;font:600 13px var(--font);color:var(--fg-2);padding:6px 13px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.updated{font-size:12px;color:var(--muted);font-family:var(--mono)}
h2{font-family:var(--display);font-size:20px;margin:34px 0 12px;letter-spacing:-.01em}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(4,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 2px;font-size:14px;font-weight:700}
.card .hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.kpi .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:13px;color:var(--fg-2);margin-top:2px}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .bar{fill:var(--series)}
.chart .bar.dim{fill:var(--series);opacity:.35}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover + .bar,.chart g:hover .bar{opacity:.85}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .08s}
.tip b{font-variant-numeric:tabular-nums}
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;white-space:nowrap;border-bottom:1px solid var(--grid);color:var(--fg-2);overflow-wrap:anywhere}
td.n,th.n{text-align:right;white-space:nowrap}
td:first-child{color:var(--fg)}
tr:last-child td{border-bottom:0}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:12px;border-radius:0 4px 4px 0;background:transparent;position:relative}
.hbar .fill{position:absolute;inset:0 auto 0 0;background:var(--series);border-radius:0 4px 4px 0;min-width:2px}
.hbar .v{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600;min-width:64px;text-align:right}
.hbar .v small{color:var(--muted);font-weight:500;margin-left:6px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--fg)}
.state{padding:80px 20px;text-align:center;color:var(--fg-2)}
.state a{color:inherit;font-weight:700}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
@media (max-width:900px){ .kpis{grid-template-columns:repeat(2,1fr)} .cols-3,.cols-2{grid-template-columns:1fr} }
@media (max-width:480px){ .wrap{padding:0 16px 48px} .kpi .val{font-size:26px} .seg{margin-left:0} }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/app"><img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-3 -1 70 66'%3E%3Crect x='-3' y='-1' width='70' height='66' rx='18' fill='%23FFC31F'/%3E%3Cg stroke='%23141414' stroke-width='3' stroke-linejoin='round' fill='%23A9AFC2'%3E%3Cpath d='M19 21C8 16 1 25 3 35c2 9 10 12 17 7z'/%3E%3Cpath d='M45 21c11-5 18 4 16 14-2 9-10 12-17 7z'/%3E%3Cellipse cx='32' cy='31' rx='17' ry='16'/%3E%3Cpath d='M27.6 38.5c-1.4 7.5-.8 13.6 3.6 16.6 3.6 2.4 8.3.6 7.6-3.4-.3-1.8-2.4-2.2-3.1-.6-.5 1.3-1.7 1.8-2.7 1-1.9-1.6-1.4-7.2.3-13.6z'/%3E%3C/g%3E%3Cellipse cx='25.6' cy='29.6' rx='2.8' ry='3.4' fill='%23141414'/%3E%3Cellipse cx='38.4' cy='29.6' rx='2.8' ry='3.4' fill='%23141414'/%3E%3C/svg%3E"><span>CRUD <b>Analytics</b></span></a>
  <div class="seg" role="group" aria-label="Date range">
    <button data-days="7">7 days</button><button data-days="30" aria-pressed="true">30 days</button><button data-days="90">90 days</button><button data-days="0">All time</button>
  </div>
  <span class="updated" id="updated"></span>
</div></header>
<main class="wrap" id="main"><div class="state">Loading…</div></main>
<div class="tip" id="tip" role="tooltip"></div>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s), main=$('#main'), tip=$('#tip');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-IN');
const inr=n=>{ n=Number(n||0); return '₹'+(Math.abs(n)<10&&n%1?n.toFixed(2):Math.round(n).toLocaleString('en-IN')); };
const pct=(a,b)=>b?Math.round(a/b*1000)/10+'%':'—';
const dShort=s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'numeric',month:'short'}); };
const dWhen=s=>new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
let days=30; try{ const v=localStorage.getItem('crud.admin.days'); if(v!==null) days=Number(v); }catch(e){}
let data=null;

/* ---- tooltip: any element with data-tip ---- */
document.addEventListener('pointermove',e=>{ const t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t){ tip.style.opacity=0; return; } tip.innerHTML=t.getAttribute('data-tip'); tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; tip.style.opacity=1; });
document.addEventListener('pointerleave',()=>tip.style.opacity=0);

/* ---- column chart: one series, one axis, 4px rounded tops, 2px gaps, hover tooltip per column ---- */
function niceMax(v){ if(v<=4) return 4; const p=Math.pow(10,Math.floor(Math.log10(v))), f=v/p; const m=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; return Math.ceil(m/4)*4; } // counts: whole-number ticks
function tick(v){ return v>=10000?(v/1000).toLocaleString('en-IN')+'K':v.toLocaleString('en-IN'); }
function columns(el){
  const pts=JSON.parse(el.dataset.points), unit=el.dataset.unit||'', W=Math.max(240,el.clientWidth), H=Number(el.dataset.h||170);
  const L=34,R=4,T=10,B=22, iw=W-L-R, ih=H-T-B, n=pts.length, max=niceMax(Math.max(1,...pts.map(p=>p.v)));
  const slot=iw/n, bw=Math.max(2,Math.min(24,slot-2));
  let s='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img" aria-label="'+esc(el.dataset.label||'')+'">';
  for(let i=0;i<=4;i++){ const y=T+ih-ih*i/4; s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+tick(max*i/4)+'</text>'; }
  const every=Math.ceil(n/Math.max(2,Math.floor(iw/(n>9?56:44))));
  pts.forEach((p,i)=>{ const x=L+slot*i+(slot-bw)/2, h=p.v?Math.max(2,ih*p.v/max):0, y=T+ih-h, r=Math.min(4,bw/2,h);
    const tipTxt=esc(p.tip||p.l)+' · <b>'+fmt(p.v)+'</b>'+(unit?' '+esc(unit):'');
    s+='<g data-tip="'+tipTxt.replace(/"/g,'&quot;')+'"><rect class="hit" x="'+(L+slot*i)+'" y="'+T+'" width="'+slot+'" height="'+ih+'"/>';
    if(h) s+='<path class="bar" d="M'+x+' '+(T+ih)+'V'+(y+r)+'q0 -'+r+' '+r+' -'+r+'h'+(bw-2*r)+'q'+r+' 0 '+r+' '+r+'V'+(T+ih)+'z"/>';
    s+='</g>';
    if(i%every===0) s+='<text x="'+(L+slot*i+slot/2)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(p.l)+'</text>'; });
  el.innerHTML=s+'</svg>';
}
function drawCharts(){ document.querySelectorAll('.chart[data-points]').forEach(columns); }
let rT; addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(drawCharts,120); });

/* ---- pieces ---- */
const kpi=(lbl,val,sub)=>'<div class="card kpi"><div class="lbl">'+lbl+'</div><div class="val">'+val+'</div><div class="sub">'+(sub||'&nbsp;')+'</div></div>';
const chart=(points,{h=170,unit='',label=''}={})=>'<div class="chart" data-h="'+h+'" data-unit="'+esc(unit)+'" data-label="'+esc(label)+'" data-points="'+esc(JSON.stringify(points))+'"></div>';
function hbars(rows,{total=0,showPct=false}={}){ if(!rows.length) return '<p class="note">Nothing yet.</p>'; const max=Math.max(1,...rows.map(r=>r.n));
  return rows.map(r=>'<div class="hbar"><span class="t" title="'+esc(r.label)+'">'+esc(r.label)+'</span><span class="track"><span class="fill" style="width:'+(r.n/max*100)+'%"></span></span><span class="v">'+fmt(r.n)+(showPct?'<small>'+(r.pct??pct(r.n,total))+'</small>':'')+'</span></div>').join(''); }
function statTable(cols){ const keys=[['avg','Average'],['median','Median'],['p75','75th percentile'],['p90','90th percentile'],['p99','99th percentile'],['max','Highest'],['n','Counted']];
  return '<div class="tscroll"><table><thead><tr><th></th>'+cols.map(c=>'<th class="n">'+esc(c[0])+'</th>').join('')+'</tr></thead><tbody>'+
    keys.map(([k,l])=>'<tr><td>'+l+'</td>'+cols.map(c=>'<td class="n">'+fmt(c[1][k])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'; }
function table(head,rows){ if(!rows.length) return '<p class="note">Nothing yet.</p>';
  return '<div class="tscroll"><table><thead><tr>'+head.map(h=>'<th'+(h.n?' class="n"':'')+'>'+esc(h.t)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(head[i].n?' class="n"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'; }

function render(){
  const d=data, rangeTxt=days?'last '+days+' days':'all time', t=d.traffic, p=d.people, a=d.actions, w=d.workspaces, m=d.money;
  const sum=k=>d.series.reduce((s,x)=>s+x[k],0);
  const fun=d.funnel.slice(1).map((f,i)=>({label:f.label,n:f.n,pct:i===0?'':pct(f.n,d.funnel[i].n)+' of previous'}));
  let h='';
  h+='<h2>Overview <span class="pill">'+rangeTxt+'</span></h2><div class="grid kpis">'+
    kpi('Visitors',fmt(t.visitors),fmt(t.views)+' page views')+
    kpi('Signups',fmt(p.newUsers),pct(p.newUsers,t.visitors)+' of visitors · '+fmt(p.total)+' total')+
    kpi('Active people',fmt(p.wau),'in the last 7 days · '+fmt(p.dau)+' today · '+fmt(p.mau)+' in 30 days')+
    kpi('Workspaces',fmt(w.newWorkspaces),'new · '+fmt(w.total)+' total')+
    kpi('AI actions',fmt(a.total),inr(a.costInr)+' AI cost · '+inr(a.costPerAction)+' each')+
    kpi('Pro workspaces',fmt(m.proWorkspaces),fmt(m.newSubscriptions)+' new · '+fmt(m.cancellations)+' cancelled')+
    kpi('Monthly recurring',inr(m.mrrInr),'from active subscriptions')+
    kpi('Revenue',inr(m.revenueInr),fmt(m.payments)+' payments · '+inr(m.revenueAllInr)+' all time')+'</div>';

  const pts=k=>d.series.map(x=>({l:dShort(x.day),tip:dShort(x.day),v:x[k]}));
  h+='<h2>Every day</h2><div class="grid cols-3">'+
    '<div class="card"><h3>Visitors</h3><p class="hint">'+fmt(sum('visitors'))+' visitor-days</p>'+chart(pts('visitors'),{unit:'visitors',label:'Visitors per day'})+'</div>'+
    '<div class="card"><h3>Signups</h3><p class="hint">'+fmt(sum('signups'))+' in this period</p>'+chart(pts('signups'),{unit:'signups',label:'Signups per day'})+'</div>'+
    '<div class="card"><h3>AI actions</h3><p class="hint">'+fmt(sum('actions'))+' in this period</p>'+chart(pts('actions'),{unit:'actions',label:'AI actions per day'})+'</div></div>';

  h+='<h2>Funnel</h2><div class="card"><p class="hint">People who signed up in this period, and how far they got · '+fmt(t.visitors)+' visitors → '+fmt(d.funnel[1].n)+' signups ('+pct(d.funnel[1].n,t.visitors)+')</p>'+hbars(fun,{showPct:true})+'</div>';

  h+='<h2>AI actions per person</h2><div class="grid cols-2">'+
    '<div class="card"><h3>Distribution</h3><p class="hint">Actions each person used in this period (voice transcription not counted)</p>'+statTable([['Everyone',a.perUserAll],['Used AI',a.perUserActive],['Per workspace',a.perWorkspace]])+'</div>'+
    '<div class="card"><h3>How many people used how many actions</h3><p class="hint">'+fmt(p.hitFreeLimit)+' people have used all their free actions</p>'+chart(a.histogram.map(x=>({l:x.label,tip:x.label+' actions',v:x.count})),{h:210,unit:'people',label:'People by actions used'})+'</div></div>';

  h+='<h2>Workspaces &amp; teams</h2><div class="grid cols-2">'+
    '<div class="card"><h3>Workspaces per person</h3><p class="hint">Average '+w.perUser.avg+' · median '+w.perUser.median+' · '+fmt(w.perUser.noWorkspace)+' signed up without one</p>'+chart(w.perUser.histogram.map(x=>({l:x.label,tip:x.label+' workspaces',v:x.count})),{unit:'people',label:'People by workspaces owned'})+'</div>'+
    '<div class="card"><h3>People per workspace</h3><p class="hint">Average '+w.members.avg+' · median '+w.members.median+' · largest '+w.members.max+' · '+fmt(w.members.joined)+' joined, '+fmt(w.members.invited)+' invited but not joined</p>'+chart(w.members.histogram.map(x=>({l:x.label,tip:x.label+' people',v:x.count})),{unit:'workspaces',label:'Workspaces by team size'})+'</div></div>';

  h+='<h2>Subscriptions &amp; usage</h2><div class="grid cols-3">'+
    '<div class="card"><h3>Subscriptions by status</h3><p class="hint">All time · '+fmt(m.payingPeople)+' people have paid</p>'+hbars(m.subscriptionStatus.map(s=>({label:s.name,n:s.n})))+'</div>'+
    '<div class="card"><h3>AI calls by type</h3><p class="hint">In this period</p>'+table([{t:'Type'},{t:'Calls',n:1},{t:'Cost',n:1}],a.byLabel.map(r=>[esc(r.name),fmt(r.n),inr(r.costInr)]))+'</div>'+
    '<div class="card"><h3>Content</h3><p class="hint">In this period</p>'+table([{t:''},{t:'',n:1}],[['Messages sent',fmt(a.messages)],['Records created',fmt(a.records)],['Voice notes transcribed',fmt(a.transcriptions)],['Opened the app',fmt(t.appVisitors)+' visitors'],['On a phone',pct(Math.round(t.mobileShare*1000),1000)]])+'</div></div>';

  h+='<h2>Where visitors come from</h2><div class="grid cols-3">'+
    '<div class="card"><h3>Referring sites</h3><p class="hint">Landing page visitors</p>'+hbars(t.referrers.map(r=>({label:r.name,n:r.visitors})))+'</div>'+
    '<div class="card"><h3>Campaigns</h3><p class="hint">From ?utm_source= in links</p>'+hbars(t.utm.map(r=>({label:r.name,n:r.visitors})))+'</div>'+
    '<div class="card"><h3>Countries</h3><p class="hint">Needs a CDN country header (e.g. Cloudflare)</p>'+hbars(t.countries.map(r=>({label:r.name,n:r.visitors})))+'</div></div>';

  h+='<h2>Most active workspaces</h2><div class="card">'+table([{t:'Workspace'},{t:'Owner'},{t:'Plan'},{t:'People',n:1},{t:'Actions',n:1},{t:'Records',n:1},{t:'Created',n:1}],
    d.topWorkspaces.map(r=>[esc(r.name),esc(r.owner),r.pro?'<span class="pill">Pro</span>':'Free',fmt(r.members),fmt(r.actions),fmt(r.records),dWhen(r.createdAt)]))+'</div>';
  h+='<h2>Latest signups</h2><div class="card">'+table([{t:'Person'},{t:'Name'},{t:'Workspaces',n:1},{t:'Free actions used',n:1},{t:'Signed up',n:1}],
    d.recentSignups.map(r=>[esc(r.who),esc(r.name),fmt(r.workspaces),fmt(r.freeUsed),dWhen(r.createdAt)]))+'</div>';
  h+='<p class="note">Visitors are counted without cookies: a one-way hash of each visitor’s IP address and browser, with bots left out. Visits before this dashboard went live aren’t counted.</p>';
  main.innerHTML=h; drawCharts();
  $('#updated').textContent='Updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}

async function load(){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.days)===days)));
  try{
    const r=await fetch('/api/admin/stats?days='+days,{credentials:'same-origin'});
    if(r.status===401){ main.innerHTML='<div class="state">Please <a href="/app">log in</a> first, then come back to this page.</div>'; return; }
    if(r.status===403){ main.innerHTML='<div class="state">This page is for admins. Add your login email to <code>ADMIN_EMAILS</code> on the server.</div>'; return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    data=await r.json(); render();
  }catch(e){ main.innerHTML='<div class="state">Couldn’t load the numbers. <a href="#" id="retry">Try again</a></div>'; $('#retry').onclick=ev=>{ ev.preventDefault(); load(); }; }
}

load();
})();
