  catch(e){ toast(e.message); } }
function renameWorkspace(){
  openSheet('<h3>Rename workspace</h3><div class="inline"><input id="rnWs" value="'+esc(ws().name)+'" autocomplete="off" maxlength="60"><button id="rnWsBtn">Save</button></div>');
  const inp=$('#rnWs'); inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);
  const go=async()=>{ const v=inp.value.trim();
    if(v){ try{ const out=await api('PATCH','/workspaces/'+ws().id,{name:v}); state.list=out.workspaces; applyServerState(out.state); }catch(e){ toast(e.message); } }
    closeSheet(); render(); };
  $('#rnWsBtn').onclick=go; inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();go();} });
}
let clearArmed=false;
async function clearWorkspace(btn){
  if(!clearArmed){ clearArmed=true; btn.classList.add('armed'); btn.querySelector('span:last-child').firstChild.textContent='Tap again to clear everything';
    setTimeout(()=>{clearArmed=false;},2600); return; }
  clearArmed=false;
  try{ const out=await api('POST','/workspaces/'+ws().id+'/clear'); applyServerState(out.state); closeSheet(); goHome(); toast('Workspace cleared'); }
  catch(e){ toast(e.message); }
}

/* ---------------- Login (WhatsApp OTP) ---------------- */
let authId='', authSentTo='';
const byEmail=()=>(state.config.loginMethod||'email')==='email';
function showAuth(step){
  const a=$('#auth'); a.hidden=false; a.dataset.step=step;
  let h='<div class="auth-card"><div class="auth-mark" id="authFace">'+eyes()+'</div>';
  if(step==='start'){
    h=h.replace('<div class="auth-mark" id="authFace">','<div class="auth-hi"><span class="say">Hi! I\u2019m CRUD.</span><div class="auth-mark" id="authFace">')+'</div>';
    h+='<h1>CRUD<span class="dot">.</span>chat</h1><p>Say what happened. I\u2019ll keep the books.</p>'+
      '<form class="auth-form" novalidate><label class="auth-lbl" for="authId">'+(byEmail()?'Email':'Mobile number')+'</label>'+
      (byEmail()
        ?'<input id="authId" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="you@yourbusiness.com" value="'+esc(authId)+'">'
        :'<input id="authId" type="tel" inputmode="tel" autocomplete="tel" placeholder="98765 43210" value="'+esc(authId)+'">')+
      '<button class="auth-btn" id="authGo" type="submit">'+(byEmail()?'Email me a code':'Get code on WhatsApp')+'</button></form>';
  }else if(step==='code'){
    h+='<h1>Enter the code</h1><p>'+(byEmail()?'Sent to '+esc(authSentTo)+'. Check spam if it\u2019s not there.':'Sent on WhatsApp to '+esc(fmtPhone(authSentTo)))+'</p>'+
      (state.devCode?'<div class="auth-dev">Test mode \u2014 your code is <b>'+esc(state.devCode)+'</b></div>':'')+
      '<form class="auth-form" novalidate><label class="auth-lbl" for="authCode">6-digit code</label>'+
      '<input id="authCode" class="auth-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022">'+
      '<button class="auth-btn" id="authGo" type="submit">Continue</button></form>'+
      '<div class="auth-links"><button id="authBack" type="button">'+(byEmail()?'Change email':'Change number')+'</button><button id="authResend" type="button">Resend code</button></div>';
  }else if(step==='name'){
    h+='<h1>What should your team call you?</h1><p>Shown next to everything you record.</p>'+
      '<form class="auth-form" novalidate><label class="auth-lbl" for="authName">Your name</label>'+
      '<input id="authName" autocomplete="name" maxlength="40" placeholder="Your name">'+
      '<button class="auth-btn" id="authGo" type="submit">Continue</button></form>';
  }else if(step==='setup'){
    const first=((state.user&&state.user.name)||'').split(/\s+/)[0];
    h+='<h1>'+(first?'Hi '+esc(first)+'! ':'')+'How do you want to start?</h1>'+
      '<form class="ob-card" data-act="create" novalidate><div class="ob-top"><span class="ob-ic">'+svg('spark')+'</span><span><b>Start fresh</b><small>A new workspace for your business</small></span></div>'+
        '<input id="obName" autocomplete="organization" maxlength="60" placeholder="Business name">'+
        '<button class="auth-btn" type="submit">Create my workspace</button></form>'+
      '<div class="ob-or"><span>or</span></div>'+
      '<form class="ob-card" data-act="code" novalidate><div class="ob-top"><span class="ob-ic alt">'+svg('people')+'</span><span><b>Join my team</b><small>Paste the invite link a teammate sent you</small></span></div>'+
        '<input id="obCode" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Invite link or code">'+
        '<button class="auth-btn ghost" type="submit">Join</button></form>';
  }else if(step==='join'){
    const j=joinInfo||{workspace:{name:'the workspace'}}; const others=Math.max(0,(j.members||1)-1);
    h+='<h1>Join '+esc(j.workspace.name)+'</h1><p>'+(j.owner?esc(j.owner)+(others>1?' and '+(others-1)+' other'+(others>2?'s':''):'')+' record'+(others>1?'':'s')+' here.':'Your team records everything here.')+'</p>'+
      '<form class="auth-form" data-act="join" novalidate><button class="auth-btn" id="authGo" type="submit">Join '+esc(j.workspace.name)+'</button></form>'+
      '<div class="auth-links" style="justify-content:center"><button id="obOwn" type="button">Start my own workspace instead</button></div>';
  }
  h+='<div class="auth-err" id="authErr" role="alert"></div></div>';
  a.innerHTML=h;
  const f=a.querySelector('input'); if(f) setTimeout(()=>{ try{f.focus();}catch(e){} },60);
}
function hideAuth(){ $('#auth').hidden=true; }
/* ---- Start or join ---- */
let joinInfo=null;
function pendingJoin(){ try{ return localStorage.getItem('crud.join')||''; }catch(e){ return ''; } }
function setPendingJoin(c){ try{ if(c) localStorage.setItem('crud.join',c); else localStorage.removeItem('crud.join'); }catch(e){} }
function codeFrom(v){ v=String(v||'').trim(); const m=v.match(/join\/([A-Za-z0-9-]+)/); return (m?m[1]:v).toLowerCase().replace(/[^a-z0-9]/g,''); }
async function createFirstWorkspace(){
  const first=((state.user&&state.user.name)||'').split(/\s+/)[0];
  const name=($('#obName').value||'').trim()||(first?first+'\u2019s workspace':'My workspace');
  const b=$('#auth').querySelector('[data-act="create"] .auth-btn'); if(b) b.disabled=true; authError('');
  try{ const out=await api('POST','/workspaces',{name}); state.list=out.workspaces; hideAuth(); enterWorkspace(out.current,out.state); }
  catch(e){ if(b) b.disabled=false; authError(e.message); } }
async function lookupJoin(code, fromLink){
  const say=m=>fromLink?toast(m):authError(m);
  code=codeFrom(code); if(code.length<6){ say('That doesn\u2019t look like an invite link.'); return false; }
  try{ joinInfo=await api('GET','/invites/'+code); joinInfo.code=code; }
  catch(e){ setPendingJoin(''); joinInfo=null; say(e.message); return false; }
  if(joinInfo.already){ setPendingJoin(''); hideAuth(); await switchWorkspace(joinInfo.workspace.id); return true; }
  showAuth('join'); return true; }
async function confirmJoin(){
  if(!joinInfo) return; authBusy(true); authError('');
  try{ const out=await api('POST','/invites/'+joinInfo.code+'/join'); setPendingJoin(''); state.list=out.workspaces; hideAuth(); enterWorkspace(out.current,out.state); toast('Welcome to '+out.state.name); }
  catch(e){ authBusy(false); authError(e.message); } }
function fmtPhone(p){ p=String(p||''); const m=p.match(/^\+91(\d{5})(\d{5})$/); return m?'+91 '+m[1]+' '+m[2]:p; }
function authError(m){ const el=$('#authErr'); if(el) el.textContent=m||''; }
function authBusy(on){ const b=$('#authGo'); if(b) b.disabled=on; }
async function requestCode(){
  const el=$('#authId'); const raw=(el?el.value.trim():authId);
  if(!raw){ authError(byEmail()?'Enter your email.':'Enter your mobile number.'); return; }
  authId=raw; authBusy(true); authError('');
  try{ const out=await api('POST','/auth/request-otp',{identifier:raw}); authSentTo=out.sentTo; state.devCode=out.devCode||''; showAuth('code'); }
  catch(e){ authBusy(false); authError(e.message); }
}
async function verifyCode(){
  const el=$('#authCode'); const code=(el?el.value:'').replace(/\D/g,'');
  if(code.length!==6){ authError('Enter the 6-digit code.'); return; }
  authBusy(true); authError('');
  try{ await api('POST','/auth/verify-otp',{identifier:authId,code}); state.devCode=''; await loadApp(); }
  catch(e){ authBusy(false); authError(e.message); if(el){ el.value=''; el.focus(); } }
}
async function saveName(){
  const v=($('#authName').value||'').trim(); if(!v){ authError('Enter your name.'); return; }
  authBusy(true);
  try{ const out=await api('PATCH','/me',{name:v}); state.user=out.user; await loadApp(); }
  catch(e){ authBusy(false); authError(e.message); }
}
function bindAuth(){
  const a=$('#auth');
  a.addEventListener('submit',e=>{ e.preventDefault(); const st=a.dataset.step, act=e.target.dataset.act;
    if(st==='start') requestCode(); else if(st==='code') verifyCode(); else if(st==='name') saveName();
    else if(act==='create') createFirstWorkspace(); else if(act==='code') lookupJoin($('#obCode').value); else if(act==='join') confirmJoin(); });
  a.addEventListener('click',e=>{ if(e.target.closest('#authBack')) showAuth('start'); if(e.target.closest('#authResend')) requestCode();
    if(e.target.closest('#obOwn')){ setPendingJoin(''); joinInfo=null; if(state.list.length){ hideAuth(); enterWorkspace(state.current||state.list[0].id, state.workspaces[state.current]); } else showAuth('setup'); } });
  // CRUD watches you type.
  a.addEventListener('pointermove',e=>{ const f=$('#authFace'); if(!f) return; const r=f.getBoundingClientRect();
    const dx=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/220)), dy=Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height/2))/220));
    f.style.setProperty('--lx',(dx*.09).toFixed(3)+'em'); f.style.setProperty('--ly',(dy*.07).toFixed(3)+'em'); });
  a.addEventListener('focusin',e=>{ const f=$('#authFace'); if(f&&e.target.tagName==='INPUT'){ f.style.setProperty('--lx','0em'); f.style.setProperty('--ly','.07em'); } });
  a.addEventListener('input',e=>{ if(e.target.id==='authCode'){ const v=e.target.value.replace(/\D/g,'').slice(0,6); e.target.value=v; if(v.length===6) verifyCode(); } });
}

/* ---------------- Live updates from teammates ---------------- */
let events=null, refreshT=null;
function connectEvents(id){
  if(events){ events.close(); events=null; }
  if(!id||!window.EventSource) return;
  events=new EventSource('/api/workspaces/'+id+'/events');
  events.addEventListener('change',e=>{ let d={}; try{ d=JSON.parse(e.data); }catch(_){} if(d.by!==CLIENT_ID) scheduleRefresh(); });
}
function scheduleRefresh(){ clearTimeout(refreshT); refreshT=setTimeout(refreshState,250); }
async function refreshState(){
  if(!state.current||processing) return;
  try{
    const out=await api('GET','/workspaces/'+state.current+'/state'); applyServerState(out.state);
    if(view.mode==='detail'&&!ws().records.find(r=>r.id===view.recordId)) view={mode:'list',section:view.section,recordId:null};
    if(view.mode==='list'&&!ws().sections[view.section]) view={mode:ws().order.length?'list':'home',section:ws().order[0]||null,recordId:null};
    if(view.mode==='home'&&ws().order.length) view={mode:'list',section:ws().order[0],recordId:null};
    const nw=state.list.find(x=>x.id===ws().id); if(nw) nw.name=ws().name;
    const typing=document.activeElement&&document.activeElement.classList.contains('fval-input');
    if(typing){ renderChat(); renderPeek(); renderTabs(); } else render();
    applyTheme();
  }catch(e){}
}
function enterWorkspace(id, s){
  state.current=id; applyServerState(s); savePrefs();
  view={mode:ws().order.length?'list':'home',section:ws().order[0]||null,recordId:null};
  render(); applyTheme(); connectEvents(id);
}
async function switchWorkspace(id){
  try{ const out=await api('GET','/workspaces/'+id+'/state'); enterWorkspace(id,out.state); }catch(e){ toast(e.message); }
}
async function loadApp(){
  let saved=null; try{ saved=localStorage.getItem('crud.ws'); }catch(e){}
  try{
    const b=await api('GET','/bootstrap'+(saved?'?workspace='+encodeURIComponent(saved):''));
    state.user=b.user; state.list=b.workspaces;
    if(b.current) applyServerState(b.state);
    if(!b.user.name){ showAuth('name'); return; }
    const join=pendingJoin();
    if(join){ if(b.current){ state.current=b.current; } showAuth('loading'); if(await lookupJoin(join,true)) return; }
    if(!b.current){ showAuth('setup'); return; }
    hideAuth(); enterWorkspace(b.current,b.state);
  }catch(e){ if(e.status!==401){ showAuth('start'); authError(e.message); } }
}
async function logout(){
  try{ await api('POST','/auth/logout'); }catch(e){}
  if(events){ events.close(); events=null; }
  state.user=null; state.workspaces={}; state.current=null; state.list=[];
  closeSheet(); view={mode:'home',section:null,recordId:null}; render(); showAuth('start');
}

/* ---------------- Boot ---------------- */
function boot(){
  const jm=location.pathname.match(/\/app\/join\/([A-Za-z0-9-]+)/);
  if(jm){ setPendingJoin(jm[1].toLowerCase()); try{ history.replaceState(null,'','/app'); }catch(e){} }
  loadPrefs(); applyTheme(); bind(); bindAuth(); fit();
  showAuth('loading');
  view={mode:'home',section:null,recordId:null};
  render();
  // Learn the login method (email or WhatsApp) before showing the login screen.
  fetch('/api/config').then(r=>r.json()).then(c=>{ state.config=c||{}; }).catch(()=>{}).finally(loadApp);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') scheduleRefresh(); });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
