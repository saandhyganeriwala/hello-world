function relTime(ts){
  const s=(Date.now()-ts)/1000;
  if(s<45) return 'now';
  if(s<3600) return Math.round(s/60)+'m';
  if(s<86400) return Math.round(s/3600)+'h';
  const d=new Date(ts), n=new Date();
  if(s<604800) return Math.round(s/86400)+'d';
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+(d.getFullYear()!==n.getFullYear()?" '"+String(d.getFullYear()).slice(2):'');
}
function dayLabel(ts){
  const d=new Date(ts), n=new Date();
  const dd=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const nn=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const diff=Math.round((nn-dd)/86400000);
  if(diff===0) return 'Today'; if(diff===1) return 'Yesterday';
  return d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
}
const TITLE_KEYS=['Title','Name','Customer','Client','Subject','Contact','Item','Product'];
function isUrl(v){ return /^https?:\/\/\S+$/i.test(String(v==null?'':v).trim()); }
function firstUrl(r){ for(const [k,v] of Object.entries(r.fields)){ if(isUrl(v)) return {k,v:String(v).trim()}; } return null; }
function recTitle(r){
  const secl=(r.section||'').toLowerCase(), sing=secl.replace(/s$/,'');
  const bad=v=>{ const t=String(v==null?'':v).trim().toLowerCase();
    return !t || t===secl || t===sing ||
      /^(new |abandoned |pending |open |draft )?(order|checkout|cart|record|entry|inquiry|enquiry|lead|payment|invoice|task|note|item)s?\s*#?\d*$/.test(t); };
  for(const k of TITLE_KEYS){ const v=r.fields[k]; if(v!=null&&v!==''&&!isUrl(v)&&!bad(v)) return v; }
  for(const [k,v] of Object.entries(r.fields)){ if(k==='Status'||v==null||v===''||isUrl(v)) continue; if(!bad(v)) return v; }
  for(const k of TITLE_KEYS){ if(r.fields[k]!=null&&r.fields[k]!=='') return r.fields[k]; }
  const k0=Object.keys(r.fields).find(k=>k!=='Status'); return k0?r.fields[k0]:'Untitled';
}
function titleKeyOf(r){ for(const k of TITLE_KEYS){ if(r.fields[k]!=null) return k;} const k=Object.keys(r.fields).find(k=>k!=='Status'); return k||'Title'; }
function statusOf(r){ return r.fields.Status||r.status||''; }
function statusClass(s){
  s=(s||'').toLowerCase();
  if(!s) return 'st-neutral';
  if(/\b(dispatch|ship|deliver|delivered|out for|done|complete|completed|paid|resolved|closed won|confirmed|approved|settled)\b/.test(s)) return 'st-good';
  if(/\b(payment received|received in full|fully paid)\b/.test(s)) return 'st-good';
  if(/\b(pending|await|awaiting|hold|on hold|follow|scheduled|in progress|processing|packing|draft|new lead|open)\b/.test(s)) return 'st-warn';
  if(/\b(cancel|cancelled|lost|reject|rejected|fail|failed|refund|overdue|unpaid|closed lost)\b/.test(s)) return 'st-danger';
  if(/\b(new|received|placed|created)\b/.test(s)) return 'st-accent';
  return 'st-neutral';
}

  return d.toLocaleDateString(undefined,d.getFullYear()===new Date().getFullYear()?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'}); }
function subLine(r){
  const skip=new Set([...TITLE_KEYS,'Status','Amount','Total','Value','Price']);
  const title=recTitle(r), parts=[];
  for(const [k,v] of Object.entries(r.fields)){ if(skip.has(k)||v==null||v===''||isUrl(v)||String(v)===title) continue; parts.push('<b>'+esc(prettyVal(v))+'</b>'); if(parts.length>=3) break; }
  return parts.join(' · ');
}

// Validated categorical palette (fixed order; separate dark steps). Never cycled — extra categories fold into "Other".
const SERIES={light:['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948'],

function isDark(){ const t=document.documentElement.getAttribute('data-theme'); return t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches); }
function seriesColor(i){ return SERIES[isDark()?'dark':'light'][i]; }
function mkView(o){ return Object.assign({name:'',type:'list',groupBy:'',groups:[],dateField:'',measure:'',agg:'count',chart:'',bucket:'',fields:[],filters:[],sortBy:'',sortDir:'',goal:0,unit:'',period:'',metrics:[],highlight:[],limit:0},o||{}); }

/* ---- reading values ---- */
function fieldsOf(recs){ const seen=[]; recs.forEach(r=>Object.keys(r.fields).forEach(k=>{ if(!seen.includes(k)) seen.push(k); })); return seen; }
function realKey(r,f){ if(r.fields[f]!=null) return f; const lf=String(f).toLowerCase(); return Object.keys(r.fields).find(k=>k.toLowerCase()===lf)||f; }
function val(r,f){ if(f==='Created') return r.createdAt; if(f==='Updated') return r.updatedAt; if(f==='By') return r.author||''; const v=r.fields[realKey(r,f)]; return v==null?'':v; }
function toNum(v){ if(typeof v==='number') return v; const s=String(v==null?'':v).replace(/[,₹\s]/g,'').replace(/^−/,'-'); const m=s.match(/-?\d+(\.\d+)?/); if(!m) return NaN;
  let n=parseFloat(m[0]); const tail=s.slice(m.index+m[0].length).toLowerCase();
  if(/^k\b/.test(tail)) n*=1e3; else if(/^(l|lakh|lac)/.test(tail)) n*=1e5; else if(/^(cr|crore)/.test(tail)) n*=1e7; return n; }
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parseDate(v){
  if(v==null||v==='') return null; if(typeof v==='number') return new Date(v);
  let s=String(v).trim().toLowerCase(); const now=new Date(); const day=d=>{ const x=new Date(now); x.setHours(12,0,0,0); x.setDate(x.getDate()+d); return x; };
  if(/^today\b/.test(s)) return day(0); if(/^tomorrow\b/.test(s)) return day(1); if(/^yesterday\b/.test(s)) return day(-1);
  const wd=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'].findIndex(w=>s.startsWith(w)||s.startsWith('next '+w)||s.startsWith(w.slice(0,3)+' ')||s===w.slice(0,3));
  if(wd>=0){ let d=(wd-now.getDay()+7)%7; if(d===0) d=7; return day(d); }
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3],12);
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if(m){ const y=+m[3]<100?2000+ +m[3]:+m[3]; return new Date(y,+m[2]-1,+m[1],12); } // Indian order: day first
  s=s.replace(/(\d)(st|nd|rd|th)\b/g,'$1').replace(/^(\d{1,2})\s*[–-]\s*\d{1,2}(\s+[a-z]+)/,'$1$2');
  m=s.match(/^(\d{1,2})\s+([a-z]{3,})\.?,?\s*(\d{4})?/); if(m){ const mo=MONTHS.indexOf(m[2].slice(0,3)); if(mo>=0) return new Date(m[3]?+m[3]:now.getFullYear(),mo,+m[1],12); }
  m=s.match(/^([a-z]{3,})\.?\s+(\d{1,2}),?\s*(\d{4})?/); if(m){ const mo=MONTHS.indexOf(m[1].slice(0,3)); if(mo>=0) return new Date(m[3]?+m[3]:now.getFullYear(),mo,+m[2],12); }
  const t=Date.parse(v); return isNaN(t)?null:new Date(t);
}
function dateOf(r,f){ if(!f||f==='Created') return new Date(r.createdAt); if(f==='Updated') return new Date(r.updatedAt); return parseDate(val(r,f))||null; }
function isNumField(recs,f){ const vs=recs.map(r=>val(r,f)).filter(v=>v!==''); if(!vs.length) return false;
  if(/phone|mobile|contact|pin|zip|ref|id$|number$|no\.?$|year/i.test(f)) return false;
  return vs.filter(v=>{ const s=String(v); return !isNaN(toNum(s)) && !/\d{10,}/.test(s.replace(/\D/g,'').length>=10?s.replace(/\D/g,''):'') && !/[a-z]{4,}/i.test(s.replace(/lakh|crore|ml|kg|km|hrs?|mins?|glass(es)?|cups?|steps?|pcs|pieces|units?|litres?|liters?/ig,'')); }).length>=Math.max(1,vs.length*0.6); }
function isMoneyField(recs,f){ return /amount|total|price|value|cost|revenue|salary|balance|paid|due|budget|spend|fee|rate/i.test(f)||recs.some(r=>/₹|rs\.?|inr/i.test(String(val(r,f)))); }
function isDateField(recs,f){ if(/^(created|updated)$/i.test(f)) return true; const vs=recs.map(r=>val(r,f)).filter(v=>v!==''); if(!vs.length) return false;
  return /date|when|due|deadline|day|time|scheduled|on$|at$/i.test(f) ? vs.some(v=>parseDate(v)) : vs.filter(v=>parseDate(v)&&/[a-z]{3}|\d[\/-]\d/i.test(String(v))).length>=vs.length*0.7; }
function detectMeasure(recs){ const fs=fieldsOf(recs); return ['Amount','Total','Value','Quantity','Qty','Count','Hours','Steps','Weight'].find(f=>fs.includes(f)&&isNumField(recs,f))||fs.find(f=>f!=='Title'&&isNumField(recs,f))||''; }
function detectDate(recs){ const fs=fieldsOf(recs); return fs.find(f=>/date|when|due|deadline|scheduled/i.test(f)&&isDateField(recs,f))||''; }
function detectStage(recs){ const fs=fieldsOf(recs); return ['Stage','Status','Pipeline','State'].find(f=>fs.includes(f))||''; }
function unitOf(recs){ const c={}; recs.forEach(r=>{ const u=val(r,'Unit'); if(u) c[u]=(c[u]||0)+1; }); return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||''; }

/* ---- numbers ---- */
function aggregate(recs,agg,measure){
  if(agg==='count'||!measure) return recs.length;
  const ns=recs.map(r=>toNum(val(r,measure))).filter(n=>isFinite(n)); if(!ns.length) return 0;
  if(agg==='sum') return ns.reduce((a,b)=>a+b,0); if(agg==='avg') return ns.reduce((a,b)=>a+b,0)/ns.length;
  if(agg==='min') return Math.min(...ns); if(agg==='max') return Math.max(...ns); return ns.length; }
function fmtNum(n,money,unit){ if(!isFinite(n)) return '—'; const r=Math.abs(n)>=100?Math.round(n):Math.round(n*100)/100;
  const s=money?'₹'+inr(r):(Math.abs(r)>=1000?inr(r):String(r)); return s+(unit&&!money?' '+unit:''); }
function fmtShort(n,money){ const a=Math.abs(n); const p=money?'₹':''; if(a>=1e7) return p+(n/1e7).toFixed(a>=1e8?0:1)+'Cr'; if(a>=1e5) return p+(n/1e5).toFixed(a>=1e6?0:1)+'L'; if(a>=1e3) return p+(n/1e3).toFixed(a>=1e4?0:1)+'k'; return p+Math.round(n*10)/10; }

/* ---- filters, sorting, grouping ---- */
function inRange(d,op,value){ if(!d) return false; const now=new Date(); const sod=new Date(now); sod.setHours(0,0,0,0);
  if(op==='today'){ const e=new Date(sod); e.setDate(e.getDate()+1); return d>=sod&&d<e; }
  if(op==='thisWeek'){ const s=new Date(sod); s.setDate(s.getDate()-((s.getDay()+6)%7)); const e=new Date(s); e.setDate(e.getDate()+7); return d>=s&&d<e; }
  if(op==='thisMonth') return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  if(op==='lastDays'){ const s=new Date(sod); s.setDate(s.getDate()-(parseInt(value,10)||7)+1); return d>=s&&d<=now; } return false; }
function passes(r,f){
  const raw=val(r,f.field), s=String(raw).toLowerCase().trim(), fv=String(f.value||'').toLowerCase().trim();
  switch(f.op){
    case 'eq': return s===fv; case 'neq': return s!==fv; case 'contains': return s.includes(fv);
    case 'empty': return !s; case 'notEmpty': return !!s;
    case 'gt': case 'gte': case 'lt': case 'lte': {
      let a=toNum(raw), b=toNum(f.value); if(!isFinite(a)||!isFinite(b)||/date|when|due/i.test(f.field)){ const da=dateOf(r,f.field), db=parseDate(f.value); if(da&&db){ a=+da; b=+db; } }
      if(!isFinite(a)||!isFinite(b)) return false; return f.op==='gt'?a>b:f.op==='gte'?a>=b:f.op==='lt'?a<b:a<=b; }
    default: return inRange(dateOf(r,f.field),f.op,f.value);
  } }
function applyFilters(recs,filters){ return (filters||[]).reduce((rs,f)=>rs.filter(r=>passes(r,f)),recs); }
function sortRecs(recs,v,secSort){
  const by=v.sortBy||(secSort&&secSort.by)||''; const dir=(v.sortBy?v.sortDir:(secSort&&secSort.dir))==='asc'?1:-1;
  if(!by) return recs.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  const dateish=/date|when|due|created|updated/i.test(by);
  return recs.slice().sort((a,b)=>{ const va=val(a,by), vb=val(b,by);
    if(dateish){ const da=dateOf(a,by), db=dateOf(b,by); if(da&&db) return (da-db)*dir; }
    const na=toNum(va), nb=toNum(vb); if(isFinite(na)&&isFinite(nb)) return (na-nb)*dir;
    return String(va).localeCompare(String(vb))*dir; }); }
const STAGE_ORDER=['new','open','enquiry','inquiry','lead','contacted','follow up','qualified','interested','proposal','quoted','negotiation','pending','confirmed','approved','in progress','doing','packing','packed','ready','scheduled','dispatched','shipped','out for delivery','delivered','completed','done','paid','won','closed','lost','cancelled','rejected','returned'];
function stageRank(k){ const i=STAGE_ORDER.indexOf(String(k).toLowerCase().trim()); return i<0?999:i; }
function groupRecs(recs,field,order){
  const m=new Map(); (order||[]).forEach(k=>m.set(k,[]));
  recs.forEach(r=>{ let k=String(val(r,field)).trim(); if(!k) k='—';
    const hit=[...m.keys()].find(x=>x.toLowerCase()===k.toLowerCase()); if(hit) k=hit; if(!m.has(k)) m.set(k,[]); m.get(k).push(r); });
  const fixed=(order||[]).filter(k=>m.has(k)), rest=[...m.keys()].filter(k=>!fixed.includes(k)).sort((a,b)=>a==='—'?1:b==='—'?-1:(stageRank(a)-stageRank(b))||(m.get(b).length-m.get(a).length));
  return [...fixed,...rest].map(k=>({key:k,recs:m.get(k)})); }
function hlClass(r,v){ const h=(v.highlight||[]).find(x=>passes(r,x)); return h?' hl-'+h.color:''; }

/* ---- which views a section has ---- */
function defaultViews(name,kind,recs){
  const amt=detectMeasure(recs), stage=detectStage(recs), dateF=detectDate(recs), money=amt&&isMoneyField(recs,amt);
  const L=[]; const add=o=>L.push(mkView(o));
  const chartMonthly=n=>amt&&add({name:n,type:'chart',chart:'bar',bucket:'month',measure:amt,agg:'sum'});
  if(kind==='tracker'){ add({name:'Tracker',type:'tracker',measure:amt,agg:amt?'sum':'count',period:'day',unit:unitOf(recs),dateField:dateF}); add({name:'Trend',type:'chart',chart:'bar',bucket:'day',measure:amt,agg:amt?'sum':'count',dateField:dateF}); add({name:'Log',type:'list',sortBy:dateF||'Created',sortDir:'desc'}); return L; }
  if(kind==='meetings'){ add({name:'Agenda',type:'agenda',dateField:dateF}); add({name:'Calendar',type:'calendar',dateField:dateF}); add({name:'List',type:'list'}); return L; }
  if(kind==='inquiries'&&stage){ add({name:'Pipeline',type:'board',groupBy:stage,measure:money?amt:'',agg:money?'sum':'count'}); add({name:'List',type:'list'}); add({name:'Funnel',type:'funnel',groupBy:stage}); add({name:'Table',type:'table'}); return L; }
  add({name:'List',type:'list'});
  if(kind==='payments'&&amt) add({name:'Ledger',type:'ledger',measure:amt});
  if(stage&&['orders','tasks','generic','inquiries','crm','people'].includes(kind)) add({name:'Board',type:'board',groupBy:stage,measure:money?amt:'',agg:money?'sum':'count'});
  if(kind==='people'){ const dep=fieldsOf(recs).find(f=>/department|team|role/i.test(f)); if(dep) add({name:'By team',type:'board',groupBy:dep}); }
  if(kind==='tasks'&&dateF) add({name:'Calendar',type:'calendar',dateField:dateF});
  if(kind==='orders') chartMonthly('Revenue'); else if(kind==='payments') chartMonthly('Monthly');
  else if(kind==='inventory'&&amt) add({name:'Stock',type:'chart',chart:'bar',groupBy:'Title',measure:amt,agg:'sum'});
  else if(kind==='generic'&&money) chartMonthly('Chart');
  add({name:'Table',type:'table'});
  return L; }
function viewsFor(name){
  const s=ws().sections[name]; const recs=ws().records.filter(r=>r.section===name);
  const list=defaultViews(name,kindOf(name),recs); const saved=(s&&Array.isArray(s.views)?s.views:[]).map(mkView);
  saved.forEach(v=>{ let i=list.findIndex(d=>d.name.toLowerCase()===v.name.toLowerCase()&&!d.saved);
    if(i<0&&!['list','table','chart'].includes(v.type)) i=list.findIndex(d=>!d.saved&&d.type===v.type);
    if(i>=0) list[i]=Object.assign(v,{saved:true,custom:list[i].name.toLowerCase()!==v.name.toLowerCase()}); else list.push(Object.assign(v,{saved:true,custom:true})); });
  return list; }
function viewKey(name){ return 'crud.v.'+ws().id+'.'+name; }
function activeViewName(name){ try{ return localStorage.getItem(viewKey(name))||''; }catch(e){ return ''; } }
function setActiveView(name,vn){ try{ localStorage.setItem(viewKey(name),vn); }catch(e){} }
function activeView(name){ const vs=viewsFor(name); const n=activeViewName(name).toLowerCase(); return vs.find(v=>v.name.toLowerCase()===n)||vs[0]; }
async function saveView(section,v,oldName){
  const clean=Object.assign({},v); delete clean.saved; delete clean.custom;
  try{ const out=await api('POST','/workspaces/'+ws().id+'/views',{section,view:clean}); applyServerState(out.state);
    if(oldName&&oldName.toLowerCase()!==clean.name.toLowerCase()&&viewsFor(section).some(x=>x.custom&&x.name===oldName)){} setActiveView(section,clean.name); renderCanvas(); }
  catch(e){ toast(e.message); } }
async function deleteView(section,name){ try{ const out=await api('POST','/workspaces/'+ws().id+'/views',{section,remove:name}); applyServerState(out.state); setActiveView(section,''); renderCanvas(); }catch(e){ toast(e.message); } }

/* ---- the section screen ---- */
let calMonth={}, calDay={};
/* ---- which layouts make sense for this data ---- */
function distinctVals(recs,f){ return [...new Set(recs.map(r=>String(val(r,f)).trim()).filter(Boolean))]; }
function catFields(recs){ return fieldsOf(recs).filter(f=>{ if(/^(title|name|customer|note|notes|description|reason)$/i.test(f)) return false; const d=distinctVals(recs,f); return d.length>=2&&d.length<=12&&d.length<recs.length; }); }
function relevantTypes(recs,kind){
  const fs=fieldsOf(recs), num=detectMeasure(recs), date=detectDate(recs), stage=detectStage(recs), cats=catFields(recs), money=num&&isMoneyField(recs,num);
  const T=['list','table'];
  if(stage||cats.length) T.push('board'); if(stage) T.push('funnel');
  if(date||kind==='meetings') T.push('calendar','agenda');
  if(num||cats.length) T.push('chart'); if(num) T.push('metrics');
  if(num&&(kind==='tracker'||fs.includes('Unit'))) T.push('tracker');
  if(money&&(kind==='payments'||fs.some(f=>/^(type|direction)$/i.test(f)))) T.push('ledger');
  if(num&&(cats.length||fs.some(f=>/customer|name|title|product|item/i.test(f)))) T.push('leaderboard');
  return T; }

/* ---- the slim bar: [view ▾] ........ [Filter] [Sort] ---- */
function viewBar(name,v,all){
  const nf=(v.filters||[]).length, sorted=!!(v.sortBy||v.groupBy);

function newView(type){

/* ---- Sort & group sheet ---- */
function sortSheet(){ const v=activeView(view.section); draft=JSON.parse(JSON.stringify(v)); draftFrom=v.name; renderSortSheet(); }
function renderSortSheet(){
  const name=view.section, recs=ws().records.filter(r=>r.section===name), v=draft, fs=fieldsOf(recs);

    let first=keys.findIndex(k=>by[k]); if(first<0) first=keys.length-1; const ks=keys.slice(Math.min(first,Math.max(0,keys.length-4)));

  const by=v.groupBy||detectStage(recs)||'Title'; let gs=groupRecs(recs,by).map(g=>({label:g.key==='—'?'No '+by:g.key,value:aggregate(g.recs,agg,m)})).sort((a,b)=>b.value-a.value);
  const cap=(v.chart==='pie'||v.chart==='donut')?7:12; if(gs.length>cap){ const rest=gs.slice(cap-1); gs=gs.slice(0,cap-1).concat([{label:'Other',value:rest.reduce((a,g)=>a+g.value,0)}]); }

/* ---- tooltip (hover on desktop, tap on phones) ---- */
function bindTips(){ const c=$('#canvas'); let tip=$('#ctip'); if(!tip){ tip=document.createElement('div'); tip.id='ctip'; tip.className='ctip'; document.body.appendChild(tip); }
  const show=(el,x,y)=>{ tip.textContent=el.dataset.tip; tip.style.left=Math.min(innerWidth-12-tip.offsetWidth/2,Math.max(12+tip.offsetWidth/2,x))+'px'; tip.style.top=(y-14)+'px'; tip.classList.add('on'); };
  c.addEventListener('pointermove',e=>{ const el=e.target.closest('[data-tip]'); if(el&&e.pointerType==='mouse') show(el,e.clientX,e.clientY); else if(e.pointerType==='mouse') tip.classList.remove('on'); });
  c.addEventListener('pointerleave',()=>tip.classList.remove('on'));
  c.addEventListener('click',e=>{ const el=e.target.closest('[data-tip]'); if(el&&!e.target.closest('[data-id]')){ const r=el.getBoundingClientRect(); show(el,r.left+r.width/2,r.top); clearTimeout(tip._t); tip._t=setTimeout(()=>tip.classList.remove('on'),1800); } });

/* ---- board drag & drop (long-press on touch, drag on mouse) ---- */
let dragJustEnded=0;
function bindBoardDrag(){
  const c=$('#canvas'); let st=null;
  const begin=(card,x,y)=>{ const r=card.getBoundingClientRect(); const ghost=card.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width=r.width+'px';
    document.body.appendChild(ghost); card.classList.add('lifted'); st.ghost=ghost; st.dx=x-r.left; st.dy=y-r.top; st.on=true; buzz(12); move(x,y); };
  const move=(x,y)=>{ if(!st||!st.on) return; st.ghost.style.transform='translate('+(x-st.dx)+'px,'+(y-st.dy)+'px) rotate(2deg)';
    st.ghost.style.visibility='hidden'; const under=document.elementFromPoint(x,y); st.ghost.style.visibility='';
    const col=under&&under.closest('.bcol'); c.querySelectorAll('.bcol.over').forEach(el=>el!==col&&el.classList.remove('over')); if(col) col.classList.add('over'); st.col=col;
    const b=c.querySelector('.board'); if(b){ const br=b.getBoundingClientRect(); if(x>br.right-40) b.scrollLeft+=12; else if(x<br.left+40) b.scrollLeft-=12; } };
  const end=()=>{ if(!st) return; clearTimeout(st.t); const s=st; st=null; if(!s.on) return; dragJustEnded=Date.now();
    s.ghost.remove(); s.card.classList.remove('lifted'); c.querySelectorAll('.bcol.over').forEach(el=>el.classList.remove('over'));
    const col=s.col&&s.col.dataset.col, from=s.card.closest('.bcol').dataset.col, by=c.querySelector('.board').dataset.by;
    if(col&&col!==from){ const r=ws().records.find(x=>x.id===s.card.dataset.id); if(!r) return; const fields=Object.assign({},r.fields); fields[realKey(r,by)]=col==='—'?'':col;
      r.fields=fields; recentIds=new Set([r.id]); renderCanvas(); setTimeout(()=>{recentIds=new Set();},900); saveRecord(r.id,fields,'moved this to '+col); } };
  c.addEventListener('mousedown',e=>{ const card=e.target.closest('.bcard'); if(!card||!card.closest('.board')||e.button) return; st={card,x:e.clientX,y:e.clientY,on:false}; });
  addEventListener('mousemove',e=>{ if(!st||st.touch) return; if(!st.on&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>6) begin(st.card,e.clientX,e.clientY); else move(e.clientX,e.clientY); });

    st={card,x:t.clientX,y:t.clientY,on:false,touch:true}; st.t=setTimeout(()=>{ if(st&&!st.on) begin(card,st.x,st.y); },260); },{passive:true});

  c.addEventListener('contextmenu',e=>{ if(e.target.closest('.board .bcard')) e.preventDefault(); }); }

const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
// Totals in the section header roll up to their new value instead of jumping.
function countUp(){
  document.querySelectorAll('#canvas .metric b[data-m]').forEach(b=>{
    const key=ws().id+'|'+view.section+'|'+b.dataset.m, txt=b.textContent;
    const to=parseFloat(txt.replace(/[^\d.]/g,''))||0, from=lastMetrics[key]; lastMetrics[key]=to;
    if(from==null||from===to||REDUCE) return;
    const pre=(txt.match(/^[^\d]*/)||[''])[0], t0=performance.now();
    const step=t=>{ const k=Math.min(1,(t-t0)/700), e=1-Math.pow(1-k,3), v=from+(to-from)*e;
      if(!b.isConnected) return; b.textContent=pre+inr(v); if(k<1) requestAnimationFrame(step); else b.textContent=txt; };
    requestAnimationFrame(step); });
}

/* ---------------- Sending a message (Claude runs on the server) ---------------- */
// Screenshots go up as JPEGs no larger than Claude reads (1568px on the long side).
function makeUpload(file){ return new Promise(resolve=>{
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image();
    img.onload=()=>{ const max=1568; let w=img.width||max, h=img.height||max; const sc=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
      try{ const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve({data:cv.toDataURL('image/jpeg',0.85).split(',')[1],mediaType:'image/jpeg'}); }catch(e){ resolve(null); } };
    img.onerror=()=>resolve(null); img.src=fr.result; };
  fr.onerror=()=>resolve(null); fr.readAsDataURL(file);
}); }
async function sendMessage(text, images, thumbs){
  text=(text||'').trim(); const hasImg=!!(images&&images.length);
  const w=ws();
  if((!text&&!hasImg)||processing||!w.id) return;
  const ctxId=(view.mode==='detail')?view.recordId:null;
  // Show the bubble straight away; the server's copy replaces it.
  const temp={id:'tmp'+uid(),author:w.me,authorName:activeMember().name,
    text:text||(hasImg?(images.length>1?images.length+' screenshots':'Screenshot'):''),ts:Date.now(),pending:true};
  if(thumbs&&thumbs.length) temp.images=thumbs;
  w.messages.push(temp);
  $('#input').value=''; autosize(); processing=true; document.body.classList.add('busy'); updateSend(); renderChat(); renderPeek();
  const uploads=hasImg?(await Promise.all(images.map(makeUpload))).filter(Boolean):[];
  let out;
  try{
    const viewing=(view.mode==='list'&&view.section&&w.sections[view.section])?{section:view.section,view:(()=>{ const v=Object.assign({},activeView(view.section)); delete v.saved; delete v.custom; return v; })()}:null;
    out=await api('POST','/workspaces/'+w.id+'/messages',{text,images:uploads,thumbs:thumbs||[],contextRecordId:ctxId,viewing});
  }catch(e){
    const i=w.messages.indexOf(temp); if(i>=0) w.messages.splice(i,1);
    if(text&&!$('#input').value){ $('#input').value=text; autosize(); }
    processing=false; document.body.classList.remove('busy'); updateSend(); render(); toast(e.message); return;
  }
  processing=false; document.body.classList.remove('busy');
  applyServerState(out.state);
  (out.effects||[]).forEach(applyEffect);
  const r=out.result||{};
  if(r.kind==='record'||r.kind==='fallback'){
    if(r.isNew) newSection=r.section;
    if(ctxId&&r.rid===ctxId) view={mode:'detail',section:r.section,recordId:ctxId};
    else if(r.section){ recentIds=new Set(r.touched||[]); view={mode:'list',section:r.section,recordId:null}; }
    if(r.section) buzz(14);
  }else if((r.kind==='question'||r.kind==='command')&&r.focus&&view.mode!=='detail'){
    const f=ws().order.find(o=>o.toLowerCase()===String(r.focus).toLowerCase());
    if(f){ view={mode:'list',section:f,recordId:null}; if(r.view) setActiveView(f,r.view); }
  }
  if(view.mode==='detail'&&!ws().records.find(x=>x.id===view.recordId)) view={mode:'list',section:view.section,recordId:null};
  if(view.mode==='list'&&!ws().sections[view.section]) view={mode:ws().order.length?'list':'home',section:ws().order[0]||null,recordId:null};
  if(view.mode==='home'&&ws().order.length) view={mode:'list',section:ws().order[0],recordId:null};
  if(r.kind==='command'){ const nw=state.list.find(x=>x.id===ws().id); if(nw) nw.name=ws().name; }
  if(r.kind==='limit'&&!limitShown){ limitShown=true; setTimeout(planSheet,700); }
  updateSend(); render(); applyTheme();
  if(view.mode==='list') $('#canvas').scrollTop=0;
  setTimeout(()=>{recentIds=new Set();},1400);
}

const COLORS={red:'#E5484D',orange:'#E8622C',amber:'#D98A20',yellow:'#CA9A04',lime:'#5BA300',green:'#1C8A57',emerald:'#0E9F6E',teal:'#0D9488',cyan:'#0891B2',sky:'#0EA5E9',blue:'#2F54EB',indigo:'#4F46E5',violet:'#7C3AED',purple:'#9333EA',fuchsia:'#C026D3',magenta:'#C026D3',pink:'#DB2777',rose:'#E11D48',maroon:'#9F1239',brown:'#8A5A2B',slate:'#52606D',gray:'#52606D',grey:'#52606D',black:'#2A2A26'};

function hexRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function applyTheme(){ const root=document.documentElement;
  if(state.theme==='light') root.setAttribute('data-theme','light');
  else if(state.theme==='dark') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
  const props=['--accent','--accent-ink','--accent-weak','--accent-weak-2'];
  const acc=ws().accent;  // set for the whole team via "change the accent to …"
  if(acc){ try{ const [r,g,b]=hexRgb(acc);
    root.style.setProperty('--accent',acc); root.style.setProperty('--accent-ink',acc);
    root.style.setProperty('--accent-weak','rgba('+r+','+g+','+b+',.13)'); root.style.setProperty('--accent-weak-2','rgba('+r+','+g+','+b+',.26)');

function cmpRec(a,b,sort){ const by=sort.by, dir=sort.dir==='asc'?1:-1;
  const numeric=/amount|total|value|price|qty|quantity|rate|stock|count/i.test(by);
  const ga=by==='Amount'||/amount|total|value|price/i.test(by)?amtNum(a):String(fget(a,[by])||'');
  const gb=by==='Amount'||/amount|total|value|price/i.test(by)?amtNum(b):String(fget(b,[by])||'');
  if(typeof ga==='number'&&typeof gb==='number') return (ga-gb)*dir;
  const na=parseFloat(String(ga).replace(/[^0-9.-]/g,'')), nb=parseFloat(String(gb).replace(/[^0-9.-]/g,''));
  if(numeric&&!isNaN(na)&&!isNaN(nb)) return (na-nb)*dir;
  return String(ga).localeCompare(String(gb))*dir;
}

function startFieldEdit(el){
  if(el.classList.contains('edit')||el.classList.contains('nolink')||!el.dataset.k) return;
  const cur=el.textContent; el.classList.add('edit');
  el.innerHTML='<input class="fval-input" value="'+esc(cur)+'">';
  const inp=el.querySelector('input'); inp.focus(); inp.setSelectionRange(cur.length,cur.length);
  let done=false;
  const commit=()=>{ if(done) return; done=true;
    const k=el.dataset.k; const v=inp.value.trim();
    const r=ws().records.find(x=>x.id===view.recordId); if(!r||v===cur){ render(); return; }
    const fields={}; for(const [fk,fv] of Object.entries(r.fields)){ if(fk!==k) fields[fk]=fv; else if(v) fields[fk]=v; }  // keeps field order
    r.fields=fields; render();  // instant feedback; the server confirms
    saveRecord(r.id,fields,v?'edited '+k:'removed '+k); };
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} if(e.key==='Escape'){inp.value=cur;inp.blur();} });
}

function runSearch(q){

/* ---------------- Voice ----------------
   Tap the mic to start and tap again to finish, or hold it and let go. Either way the words land in
   the composer to check and edit — nothing is sent until you press send.
   Every recording has a session number. Once it is finished, cancelled or sent, anything the
   recogniser still reports is ignored, so sent text can never reappear in the composer. */
const VOICE_MSG='Microphone access is blocked — allow it for this site in your browser settings.';
const VOICE_UNSUPPORTED='Voice typing isn’t supported in this browser — try Chrome or Safari.';
const IS_ANDROID=/Android/i.test(navigator.userAgent);

var voice={on:false,session:0,rec:null,base:'',done:'',stopping:false,blocked:false,restarts:0,downAt:0,mode:null};
function setListening(on,hint){
  $('#listening').hidden=!on; const mb=$('#micBtn'); mb.classList.toggle('rec',on);
  mb.innerHTML=svg(on?'stop':'mic'); mb.setAttribute('aria-label',on?'Finish voice note':'Voice note');
  voice.hint=hint||''; $('#listenHint').textContent=hint||'Listening…'; }
function voiceText(seg){ return (voice.base+voice.done+' '+seg).replace(/\s+/g,' ').trim(); }
/* ---- Better voice: record here, a proper speech-to-text model writes it out (server). ----
   Used when the server has a transcription provider; otherwise the browser's recognition below.
   Audio goes up in ≤25-second segments (one provider's limit), joined back into one note. */
const SEG_MS=25000, MAX_MS=180000;
function serverVoice(){ return !!(state.config&&state.config.transcribe&&window.MediaRecorder&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia); }
function pickMime(){ return ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(m=>{ try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; } })||''; }
async function recStart(sess){
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ if(sess===voice.session){ voice.on=false; voice.session++; setListening(false); if(e&&e.name==='NotAllowedError'){ voice.blocked=true; $('#micBtn').classList.add('off'); toast(VOICE_MSG); } else toast('No microphone found'); } return; }
  if(sess!==voice.session){ stream.getTracks().forEach(t=>t.stop()); return; }
  voice.stream=stream; voice.segs=[]; voice.mime=pickMime(); voice.t0=Date.now();
  try{ const AC=window.AudioContext||window.webkitAudioContext; voice.ac=new AC(); const an=voice.ac.createAnalyser(); an.fftSize=256; voice.ac.createMediaStreamSource(stream).connect(an); voice.an=an; }catch(e){}
  recSegment(sess);
  voice.tick=setInterval(()=>{ if(sess!==voice.session||voice.stopping) return; const ms=Date.now()-voice.t0;
    $('#listenHint').textContent=Math.floor(ms/60000)+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')+' · '+(voice.hint||'Listening…'); if(ms>=MAX_MS) stopVoice(); },250);
  // The bars follow your voice.
  const bars=[...document.querySelectorAll('#listening .wave i')], data=new Uint8Array(128);
  const draw=()=>{ if(sess!==voice.session||!voice.an||voice.stopping) return; voice.an.getByteTimeDomainData(data); let m=0; for(const v of data) m=Math.max(m,Math.abs(v-128));
    const lvl=Math.min(1,m/48); bars.forEach((b,i)=>{ b.style.animation='none'; b.style.height=(3+lvl*11*(.55+.45*Math.abs(Math.sin(Date.now()/140+i*1.3))))+'px'; }); voice.raf=requestAnimationFrame(draw); };
  draw(); }
function recSegment(sess){
  const mr=new MediaRecorder(voice.stream, voice.mime?{mimeType:voice.mime}:undefined), chunks=[], t0=Date.now();
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };

  voice.mr=mr; mr.start();

function recRelease(){ clearTimeout(voice.segT); clearInterval(voice.tick); cancelAnimationFrame(voice.raf);
  if(voice.stream) voice.stream.getTracks().forEach(t=>t.stop()); voice.stream=null; try{ voice.ac&&voice.ac.close(); }catch(e){} voice.ac=null; voice.an=null; voice.mr=null;
  document.querySelectorAll('#listening .wave i').forEach(b=>{ b.style.animation=''; b.style.height=''; }); }
async function recUpload(sess){
  recRelease(); $('#listenHint').textContent='Writing it out…';
  let text='', failed=null;
  for(const sg of voice.segs.filter(x=>x.blob.size>800)){
    try{ const r=await fetch('/api/workspaces/'+ws().id+'/transcribe',{method:'POST',credentials:'same-origin',body:sg.blob,
        headers:{'content-type':sg.blob.type||'audio/webm','x-duration-ms':String(sg.ms),'x-client-id':CLIENT_ID}});
      const j=await r.json().catch(()=>({})); if(!r.ok){ failed=j.error||'Couldn’t transcribe that.'; if(r.status===402) setTimeout(planSheet,500); break; }
      text+=' '+(j.text||''); }
    catch(e){ failed='Voice needs a connection — try again'; break; } }
  if(sess!==voice.session) return;
  if(text.trim()){ $('#input').value=(voice.base+text).replace(/\s+/g,' ').trim(); autosize(); updateSend(); scheduleRefresh(); }
  if(failed) toast(failed); else if(!text.trim()) toast('I didn’t catch that — try again, a little closer to the mic');

function startVoice(){
  if(serverVoice()){
    if(voice.blocked){ toast(VOICE_MSG); return false; }
    const cur=$('#input').value.trim();
    voice.session++; voice.on=true; voice.server=true; voice.stopping=false; voice.base=cur?cur+' ':'';
    setListening(true); recStart(voice.session); return true; }
  voice.server=false;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast(VOICE_UNSUPPORTED); return false; }
  if(voice.blocked){ toast(VOICE_MSG); return false; }
  const cur=$('#input').value.trim();
  voice.session++; voice.on=true; voice.stopping=false; voice.restarts=0; voice.done=''; voice.base=cur?cur+' ':'';
  setListening(true); listen(voice.session); return true; }
function listen(sess){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let segFinal='', r; const started=Date.now();
  try{ r=new SR(); }catch(e){ finishVoice(sess); toast('Voice input isn’t available here'); return; }
  voice.rec=r; r.lang=navigator.language||'en-IN'; r.interimResults=true; r.maxAlternatives=1;
  // Android Chrome repeats earlier phrases in continuous mode, so there we listen phrase by phrase.
  r.continuous=!IS_ANDROID;
  r.onresult=e=>{ if(sess!==voice.session) return;
    let fin='', interim='';
    for(let i=0;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) fin+=t+' '; else interim+=t+' '; }
    segFinal=fin; $('#input').value=voiceText(fin+interim); autosize(); updateSend(); };
  r.onerror=ev=>{ if(sess!==voice.session) return;
    if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){ voice.blocked=true; voice.stopping=true; $('#micBtn').classList.add('off'); toast(VOICE_MSG); }
    else if(ev.error==='network'){ voice.stopping=true; toast('Voice needs a connection — try again'); }
    else if(ev.error==='audio-capture'){ voice.stopping=true; toast('No microphone found'); } };
  r.onend=()=>{ if(sess!==voice.session) return;
    voice.done+=segFinal;
    // The browser stopped by itself (a pause, or Android's phrase-by-phrase mode): keep listening until the user finishes.
    if(voice.on&&!voice.stopping&&voice.restarts<40&&Date.now()-started>250){ voice.restarts++; listen(sess); return; }
    finishVoice(sess); };
  try{ r.start(); }catch(e){ finishVoice(sess); toast('Voice input isn’t available here'); } }
function stopVoice(){
  if(voice.server){ if(!voice.on||voice.stopping) return;
    if(!voice.mr){ cancelVoice(); return; } // still waiting for microphone permission
    voice.stopping=true; setListening(true,'Writing it out…'); if(voice.mr.state==='recording') voice.mr.stop(); return; }
  if(!voice.on) return; voice.stopping=true; setListening(true,'Finishing…');
  const s=voice.session; try{ voice.rec&&voice.rec.stop(); }catch(e){ finishVoice(s); return; }
  setTimeout(()=>finishVoice(s),2500); } // in case the browser never reports the end
function finishVoice(sess){
  if(sess!==voice.session||!voice.on) return;
  voice.on=false; voice.session++;
  setListening(false); const inp=$('#input'); inp.value=inp.value.replace(/\s+$/,''); autosize(); updateSend();
  if(inp.value&&!matchMedia('(pointer: coarse)').matches){ try{ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }catch(e){} } }
// Sending, or typing over the transcript, ends the recording and drops whatever it hears next.
function cancelVoice(){
  if(voice.server){ if(!voice.on) return; voice.on=false; voice.session++; try{ voice.mr&&voice.mr.state==='recording'&&voice.mr.stop(); }catch(e){} recRelease(); setListening(false); return; }
  if(!voice.on) return; voice.on=false; voice.session++;
  try{ voice.rec&&voice.rec.abort(); }catch(e){} setListening(false); }
function bindMic(){
  const mb=$('#micBtn'); let holdHint=null;
  mb.addEventListener('contextmenu',e=>e.preventDefault());
  mb.addEventListener('pointerdown',e=>{
    if(e.button>0) return; e.preventDefault(); // don't move focus or open the keyboard
    if(voice.on){ voice.mode=null; stopVoice(); return; }
    if(!startVoice()) return;
    voice.mode='press'; voice.downAt=Date.now(); try{ mb.setPointerCapture(e.pointerId); }catch(_){}
    clearTimeout(holdHint); holdHint=setTimeout(()=>{ if(voice.mode==='press'&&voice.on) setListening(true,'Listening… let go when done'); },HOLD_MS); });
  mb.addEventListener('pointerup',()=>{
    if(voice.mode!=='press') return; voice.mode=null; clearTimeout(holdHint);
    if(!voice.on) return;
    if(Date.now()-voice.downAt>=HOLD_MS) stopVoice();          // held to talk: letting go finishes
    else setListening(true,'Listening… tap ■ when done'); });   // tapped: keeps listening
  // A system prompt (e.g. microphone permission) can cancel the press: keep listening, tap to finish.
  mb.addEventListener('pointercancel',()=>{ if(voice.mode!=='press') return; voice.mode=null; clearTimeout(holdHint); if(voice.on) setListening(true,'Listening… tap ■ when done'); });
  // Keyboard (Enter/Space on the focused button) toggles.
  mb.addEventListener('click',e=>{ if(e.detail!==0) return; if(voice.on) stopVoice(); else if(startVoice()) setListening(true,'Listening… press again when done'); });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopVoice(); });
}

function makeThumb(file){ return new Promise(resolve=>{
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image();
    img.onload=()=>{ const max=256; let w=img.width||max, h=img.height||max; const sc=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
      try{ const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); resolve(cv.toDataURL('image/jpeg',0.6)); }
      catch(e){ resolve(fr.result); } };
    img.onerror=()=>resolve(fr.result); img.src=fr.result; };
  fr.onerror=()=>resolve(''); fr.readAsDataURL(file);
}); }
function isSheetFile(f){ return /\.(csv|xlsx|xls)$/i.test(f.name) || /csv|spreadsheetml|ms-excel/i.test(f.type||''); }

let xlsxP=null;
function loadXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX); if(xlsxP) return xlsxP;
  xlsxP=new Promise((res,rej)=>{ const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error('no XLSX')); s.onerror=()=>rej(new Error('xlsx load failed'));
    document.head.appendChild(s); });
  return xlsxP; }
function readText(f){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f);}); }
function readAB(f){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(new Uint8Array(r.result));r.onerror=rej;r.readAsArrayBuffer(f);}); }
function parseCSV(text){ const rows=[]; let i=0,field='',row=[],inq=false; const n=text.length;
  while(i<n){ const c=text[i];
    if(inq){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inq=false;i++;continue;} field+=c;i++;continue; }
    if(c==='"'){ inq=true;i++;continue; }
    if(c===','){ row.push(field);field='';i++;continue; }
    if(c==='\r'){ i++;continue; }
    if(c==='\n'){ row.push(field);rows.push(row);row=[];field='';i++;continue; }
    field+=c;i++; }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows; }
function sheetFromArray(name, arr){
  arr=(arr||[]).filter(r=>r && r.some(c=>String(c==null?'':c).trim()!==''));
  if(!arr.length) return {name, headers:[], rows:[]};
  const seen={}; const headers=arr[0].map((h,i)=>{ let k=String(h==null?'':h).trim()||('Column '+(i+1));
    if(seen[k]!=null){ seen[k]++; k=k+' '+seen[k]; } else seen[k]=0; return k; });
  const rows=arr.slice(1).map(r=>{ const o={}; headers.forEach((h,i)=>{ const v=r[i]; if(v!=null&&String(v).trim()!=='') o[h]=String(v).trim(); }); return o; })
    .filter(o=>Object.keys(o).length);
  return {name, headers, rows};
}
async function workbookFromFile(file){
  const base=file.name.replace(/\.(csv|xlsx|xls)$/i,'');
  if(/\.csv$/i.test(file.name)||/csv/i.test(file.type||'')){
    const arr=parseCSV(await readText(file)); return {sheets:[sheetFromArray(base,arr)].filter(s=>s.rows.length)};
  }
  const XLSX=await loadXLSX(); const wb=XLSX.read(await readAB(file),{type:'array'});
  const sheets=wb.SheetNames.map(sn=>sheetFromArray(sn, XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false,blankrows:false}))).filter(s=>s.rows.length);
  return {sheets};
}

  catch(e){ toast(e.message); if(e.status===402) setTimeout(planSheet,400); } }
async function removeMember(memberId){
  try{ const out=await api('DELETE','/workspaces/'+ws().id+'/members/'+memberId); applyServerState(out.state); teamSheet(); render(); }
  catch(e){ toast(e.message); } }
function renameWorkspace(){
  openSheet('<h3>Rename workspace</h3><div class="inline"><input id="rnWs" value="'+esc(ws().name)+'" autocomplete="off" maxlength="60"><button id="rnWsBtn">Save</button></div>');
  const inp=$('#rnWs'); inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);
  const go=async()=>{ const v=inp.value.trim();
    if(v){ try{ const out=await api('PATCH','/workspaces/'+ws().id,{name:v}); state.list=out.workspaces; applyServerState(out.state); }catch(e){ toast(e.message); } }
    closeSheet(); render(); };
  $('#rnWsBtn').onclick=go; inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();go();} });
}
let clearArmed=false;
async function clearWorkspace(btn){
  if(!clearArmed){ clearArmed=true; btn.classList.add('armed'); btn.querySelector('span:last-child').firstChild.textContent='Tap again to clear everything';
    setTimeout(()=>{clearArmed=false;},2600); return; }
  clearArmed=false;
  try{ const out=await api('POST','/workspaces/'+ws().id+'/clear'); applyServerState(out.state); closeSheet(); goHome(); toast('Workspace cleared'); }
  catch(e){ toast(e.message); }
}

/* ---------------- Login (WhatsApp OTP) ---------------- */
let authId='', authSentTo='';
const byEmail=()=>(state.config.loginMethod||'email')==='email';
function showAuth(step){
  const a=$('#auth'); a.hidden=false; a.dataset.step=step;
  let h='<div class="auth-card"><div class="auth-mark" id="authFace">'+eyes()+'</div>';
  if(step==='start'){
    h=h.replace('<div class="auth-mark" id="authFace">','<div class="auth-hi"><span class="say">Namaste! I\u2019m CRUD.</span><div class="auth-mark" id="authFace">')+'</div>';
    h+='<h1>CRUD<span class="dot">.</span>chat</h1><p>Say what happened. An elephant never forgets.</p>'+
      '<form class="auth-form" novalidate><label class="auth-lbl" for="authId">'+(byEmail()?'Email':'Mobile number')+'</label>'+
      (byEmail()
        ?'<input id="authId" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="you@yourbusiness.com" value="'+esc(authId)+'">'
        :'<input id="authId" type="tel" inputmode="tel" autocomplete="tel" placeholder="98765 43210" value="'+esc(authId)+'">')+
      '<button class="auth-btn" id="authGo" type="submit">'+(byEmail()?'Email me a code':'Get code on WhatsApp')+'</button></form>';
  }else if(step==='code'){
    h+='<h1>Enter the code</h1><p>'+(byEmail()?'Sent to '+esc(authSentTo)+'. Check spam if it\u2019s not there.':'Sent on WhatsApp to '+esc(fmtPhone(authSentTo)))+'</p>'+
      (state.devCode?'<div class="auth-dev">Test mode \u2014 your code is <b>'+esc(state.devCode)+'</b></div>':'')+
      '<form class="auth-form" novalidate><label class="auth-lbl" for="authCode">6-digit code</label>'+
      '<input id="authCode" class="auth-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022">'+
      '<button class="auth-btn" id="authGo" type="submit">Continue</button></form>'+
      '<div class="auth-links"><button id="authBack" type="button">'+(byEmail()?'Change email':'Change number')+'</button><button id="authResend" type="button">Resend code</button></div>';
  }else if(step==='name'){
    h+='<h1>What should your team call you?</h1><p>Shown next to everything you record.</p>'+
      '<form class="auth-form" novalidate><label class="auth-lbl" for="authName">Your name</label>'+
      '<input id="authName" autocomplete="name" maxlength="40" placeholder="Your name">'+
      '<button class="auth-btn" id="authGo" type="submit">Continue</button></form>';
  }else if(step==='setup'){
    const first=((state.user&&state.user.name)||'').split(/\s+/)[0];
    h+='<h1>'+(first?'Hi '+esc(first)+'! ':'')+'How do you want to start?</h1>'+
      '<form class="ob-card" data-act="create" novalidate><div class="ob-top"><span class="ob-ic">'+svg('spark')+'</span><span><b>Start fresh</b><small>A new workspace for your business</small></span></div>'+
        '<input id="obName" autocomplete="organization" maxlength="60" placeholder="Business name">'+
        '<button class="auth-btn" type="submit">Create my workspace</button></form>'+
      '<div class="ob-or"><span>or</span></div>'+
      '<form class="ob-card" data-act="code" novalidate><div class="ob-top"><span class="ob-ic alt">'+svg('people')+'</span><span><b>Join my team</b><small>Paste the invite link a teammate sent you</small></span></div>'+
        '<input id="obCode" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Invite link or code">'+
        '<button class="auth-btn ghost" type="submit">Join</button></form>';
  }else if(step==='join'){
    const j=joinInfo||{workspace:{name:'the workspace'}}; const others=Math.max(0,(j.members||1)-1);
    h+='<h1>Join '+esc(j.workspace.name)+'</h1><p>'+(j.owner?esc(j.owner)+(others>1?' and '+(others-1)+' other'+(others>2?'s':''):'')+' record'+(others>1?'':'s')+' here.':'Your team records everything here.')+'</p>'+
      '<form class="auth-form" data-act="join" novalidate><button class="auth-btn" id="authGo" type="submit">Join '+esc(j.workspace.name)+'</button></form>'+
      '<div class="auth-links" style="justify-content:center"><button id="obOwn" type="button">Start my own workspace instead</button></div>';
  }
  h+='<div class="auth-err" id="authErr" role="alert"></div></div>';
  a.innerHTML=h;
  const f=a.querySelector('input'); if(f) setTimeout(()=>{ try{f.focus();}catch(e){} },60);
}
function hideAuth(){ $('#auth').hidden=true; }
/* ---- Start or join ---- */
let joinInfo=null;
function pendingJoin(){ try{ return localStorage.getItem('crud.join')||''; }catch(e){ return ''; } }
function setPendingJoin(c){ try{ if(c) localStorage.setItem('crud.join',c); else localStorage.removeItem('crud.join'); }catch(e){} }
function codeFrom(v){ v=String(v||'').trim(); const m=v.match(/join\/([A-Za-z0-9-]+)/); return (m?m[1]:v).toLowerCase().replace(/[^a-z0-9]/g,''); }
async function createFirstWorkspace(){
  const first=((state.user&&state.user.name)||'').split(/\s+/)[0];
  const name=($('#obName').value||'').trim()||(first?first+'\u2019s workspace':'My workspace');
  const b=$('#auth').querySelector('[data-act="create"] .auth-btn'); if(b) b.disabled=true; authError('');
  try{ const out=await api('POST','/workspaces',{name}); state.list=out.workspaces; hideAuth(); enterWorkspace(out.current,out.state); }
  catch(e){ if(b) b.disabled=false; authError(e.message); } }
async function lookupJoin(code, fromLink){
  const say=m=>fromLink?toast(m):authError(m);
  code=codeFrom(code); if(code.length<6){ say('That doesn\u2019t look like an invite link.'); return false; }
  try{ joinInfo=await api('GET','/invites/'+code); joinInfo.code=code; }
  catch(e){ setPendingJoin(''); joinInfo=null; say(e.message); return false; }
  if(joinInfo.already){ setPendingJoin(''); hideAuth(); await switchWorkspace(joinInfo.workspace.id); return true; }
  showAuth('join'); return true; }
async function confirmJoin(){
  if(!joinInfo) return; authBusy(true); authError('');
  try{ const out=await api('POST','/invites/'+joinInfo.code+'/join'); setPendingJoin(''); state.list=out.workspaces; hideAuth(); enterWorkspace(out.current,out.state); toast('Welcome to '+out.state.name); }
  catch(e){ authBusy(false); authError(e.message); } }
function fmtPhone(p){ p=String(p||''); const m=p.match(/^\+91(\d{5})(\d{5})$/); return m?'+91 '+m[1]+' '+m[2]:p; }
function authError(m){ const el=$('#authErr'); if(el) el.textContent=m||''; }
function authBusy(on){ const b=$('#authGo'); if(b) b.disabled=on; }
async function requestCode(){
  const el=$('#authId'); const raw=(el?el.value.trim():authId);
  if(!raw){ authError(byEmail()?'Enter your email.':'Enter your mobile number.'); return; }
  authId=raw; authBusy(true); authError('');
  try{ const out=await api('POST','/auth/request-otp',{identifier:raw}); authSentTo=out.sentTo; state.devCode=out.devCode||''; showAuth('code'); }
  catch(e){ authBusy(false); authError(e.message); }
}
async function verifyCode(){
  const el=$('#authCode'); const code=(el?el.value:'').replace(/\D/g,'');
  if(code.length!==6){ authError('Enter the 6-digit code.'); return; }
  authBusy(true); authError('');
  try{ await api('POST','/auth/verify-otp',{identifier:authId,code}); state.devCode=''; await loadApp(); }
  catch(e){ authBusy(false); authError(e.message); if(el){ el.value=''; el.focus(); } }
}
async function saveName(){
  const v=($('#authName').value||'').trim(); if(!v){ authError('Enter your name.'); return; }
  authBusy(true);
  try{ const out=await api('PATCH','/me',{name:v}); state.user=out.user; await loadApp(); }
  catch(e){ authBusy(false); authError(e.message); }
}
function bindAuth(){
  const a=$('#auth');
  a.addEventListener('submit',e=>{ e.preventDefault(); const st=a.dataset.step, act=e.target.dataset.act;
    if(st==='start') requestCode(); else if(st==='code') verifyCode(); else if(st==='name') saveName();
    else if(act==='create') createFirstWorkspace(); else if(act==='code') lookupJoin($('#obCode').value); else if(act==='join') confirmJoin(); });
  a.addEventListener('click',e=>{ if(e.target.closest('#authBack')) showAuth('start'); if(e.target.closest('#authResend')) requestCode();
    if(e.target.closest('#obOwn')){ setPendingJoin(''); joinInfo=null; if(state.list.length){ hideAuth(); enterWorkspace(state.current||state.list[0].id, state.workspaces[state.current]); } else showAuth('setup'); } });
  // CRUD watches you type.
  a.addEventListener('pointermove',e=>{ const f=$('#authFace'); if(!f) return; const r=f.getBoundingClientRect();
    const dx=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/220)), dy=Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height/2))/220));
    f.style.setProperty('--lx',(dx*2.4).toFixed(2)+'px'); f.style.setProperty('--ly',(dy*1.8).toFixed(2)+'px'); });
  a.addEventListener('focusin',e=>{ const f=$('#authFace'); if(f&&e.target.tagName==='INPUT'){ f.style.setProperty('--lx','0px'); f.style.setProperty('--ly','1.8px'); } });
  a.addEventListener('input',e=>{ if(e.target.id==='authCode'){ const v=e.target.value.replace(/\D/g,'').slice(0,6); e.target.value=v; if(v.length===6) verifyCode(); } });
}

/* ---------------- Live updates from teammates ---------------- */
let events=null, refreshT=null;
function connectEvents(id){
  if(events){ events.close(); events=null; }
  if(!id||!window.EventSource) return;
  events=new EventSource('/api/workspaces/'+id+'/events');
  events.addEventListener('change',e=>{ let d={}; try{ d=JSON.parse(e.data); }catch(_){} if(d.by!==CLIENT_ID) scheduleRefresh(); });
}
function scheduleRefresh(){ clearTimeout(refreshT); refreshT=setTimeout(refreshState,250); }
async function refreshState(){
  if(!state.current||processing) return;
  try{
    const out=await api('GET','/workspaces/'+state.current+'/state'); applyServerState(out.state);
    if(view.mode==='detail'&&!ws().records.find(r=>r.id===view.recordId)) view={mode:'list',section:view.section,recordId:null};
    if(view.mode==='list'&&!ws().sections[view.section]) view={mode:ws().order.length?'list':'home',section:ws().order[0]||null,recordId:null};
    if(view.mode==='home'&&ws().order.length) view={mode:'list',section:ws().order[0],recordId:null};
    const nw=state.list.find(x=>x.id===ws().id); if(nw) nw.name=ws().name;
    const typing=document.activeElement&&document.activeElement.classList.contains('fval-input');
    if(typing){ renderChat(); renderPeek(); renderTabs(); } else render();
    applyTheme();
  }catch(e){}
}
function enterWorkspace(id, s){
  state.current=id; applyServerState(s); savePrefs();
  view={mode:ws().order.length?'list':'home',section:ws().order[0]||null,recordId:null};
  render(); applyTheme(); connectEvents(id);
}
async function switchWorkspace(id){
  try{ const out=await api('GET','/workspaces/'+id+'/state'); enterWorkspace(id,out.state); }catch(e){ toast(e.message); }
}
async function loadApp(){
  let saved=null; try{ saved=localStorage.getItem('crud.ws'); }catch(e){}
  try{
    const b=await api('GET','/bootstrap'+(saved?'?workspace='+encodeURIComponent(saved):''));
    state.user=b.user; state.list=b.workspaces;
    if(b.current) applyServerState(b.state);
    if(!b.user.name){ showAuth('name'); return; }
    const join=pendingJoin();
    if(join){ if(b.current){ state.current=b.current; } showAuth('loading'); if(await lookupJoin(join,true)) return; }
    if(!b.current){ showAuth('setup'); return; }
    hideAuth(); enterWorkspace(b.current,b.state);
  }catch(e){ if(e.status!==401){ showAuth('start'); authError(e.message); } }
}
async function logout(){
  try{ await api('POST','/auth/logout'); }catch(e){}
  if(events){ events.close(); events=null; }
  state.user=null; state.workspaces={}; state.current=null; state.list=[];
  closeSheet(); view={mode:'home',section:null,recordId:null}; render(); showAuth('start');
}

/* ---------------- Boot ---------------- */
function boot(){
  bindTips(); bindBoardDrag();
  const jm=location.pathname.match(/\/app\/join\/([A-Za-z0-9-]+)/);
  if(jm){ setPendingJoin(jm[1].toLowerCase()); try{ history.replaceState(null,'','/app'); }catch(e){} }
  loadPrefs(); applyTheme(); bind(); bindAuth(); fit();
  showAuth('loading');
  view={mode:'home',section:null,recordId:null};
  render();
  // Learn the login method (email or WhatsApp) before showing the login screen.
  fetch('/api/config').then(r=>r.json()).then(c=>{ state.config=c||{}; }).catch(()=>{}).finally(loadApp);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') scheduleRefresh(); });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
