<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRUD.chat — offline</title>
<style>
:root{--bg:#F4F2EC;--fg:#141414;--muted:#6B675F;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--fg:#F2EFE8;--muted:#9A968D}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.box{max-width:320px}
.mark{width:84px;height:84px;margin:0 auto 22px}
h1{font-size:22px;margin:0 0 8px;letter-spacing:-.01em}
p{color:var(--muted);margin:0 0 26px}
button{appearance:none;border:2px solid #141414;background:#FFC31F;color:#141414;font:700 16px inherit;font-family:inherit;padding:13px 28px;border-radius:999px;box-shadow:0 4px 0 #141414}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #141414}
</style>
</head>
<body>
<div class="box">
  <svg class="mark" viewBox="-3 -1 70 66" aria-hidden="true"><rect x="-3" y="-1" width="70" height="66" rx="18" fill="#FFC31F" stroke="#141414" stroke-width="2.5"/><g stroke="#141414" stroke-width="2.4" stroke-linejoin="round" fill="#A9AFC2"><path d="M19 21C8 16 1 25 3 35c2 9 10 12 17 7z"/><path d="M45 21c11-5 18 4 16 14-2 9-10 12-17 7z"/><ellipse cx="32" cy="31" rx="17" ry="16"/><path d="M27.6 38.5c-1.4 7.5-.8 13.6 3.6 16.6 3.6 2.4 8.3.6 7.6-3.4-.3-1.8-2.4-2.2-3.1-.6-.5 1.3-1.7 1.8-2.7 1-1.9-1.6-1.4-7.2.3-13.6z"/></g><ellipse cx="25.6" cy="29.6" rx="2.5" ry="3.1" fill="#141414"/><ellipse cx="38.4" cy="29.6" rx="2.5" ry="3.1" fill="#141414"/></svg>
  <h1>You’re offline</h1>
  <p>CRUD.chat needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
  <button onclick="location.href='https://crud.chat/app'">Try again</button>
</div>
<script>addEventListener('online',()=>location.href='https://crud.chat/app');</script>
</body>
</html>
